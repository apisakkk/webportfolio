<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="winShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#webBg)"/>

  <!-- Code Matrix Background Accents -->
  <g opacity="0.15" font-family="monospace" font-size="12" fill="#38bdf8">
    <text x="50" y="60">&lt;div class="creative-experience"&gt;</text>
    <text x="70" y="80">const portfolio = new CreativeEngine();</text>
    <text x="70" y="100">portfolio.render({ theme: 'blue-yellow' });</text>
    <text x="50" y="120">&lt;/div&gt;</text>
    <text x="550" y="380">addEventListener('scroll')</text>
    <text x="550" y="400">transform: translate3d(0, 0, 0);</text>
    <text x="550" y="420">filter: backdrop-blur(16px);</text>
  </g>

  <!-- Laptop / Browser Window Mockup -->
  <g transform="translate(100, 60)" filter="url(#winShadow)">
    <rect width="600" height="360" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Browser Top Bar -->
    <rect width="600" height="38" rx="14" fill="#1e293b"/>
    <circle cx="24" cy="19" r="6" fill="#ef4444"/>
    <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="100" y="8" width="400" height="22" rx="11" fill="#0f172a"/>
    <text x="210" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">https://solaris-interactive.design</text>
    <circle cx="120" cy="19" r="4" fill="#10b981"/>

    <!-- Browser Content Body -->
    <g transform="translate(0, 38)">
      <!-- Navbar inside mockup -->
      <rect width="600" height="40" fill="#0b1120" opacity="0.9"/>
      <circle cx="30" cy="20" r="10" fill="#0284c7"/>
      <text x="50" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SOLARIS</text>
      <text x="350" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">Home</text>
      <text x="410" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">About</text>
      <text x="470" y="24" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">Portfolio</text>
      <rect x="530" y="10" width="55" height="20" rx="10" fill="#0284c7"/>
      <text x="557" y="23" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Hire</text>

      <!-- Web Hero Section inside mockup -->
      <rect y="40" width="600" height="180" fill="#020617"/>
      <circle cx="480" cy="130" r="70" fill="#0284c7" opacity="0.3"/>
      <circle cx="500" cy="110" r="45" fill="#f59e0b" opacity="0.4"/>

      <!-- Headlines -->
      <rect x="40" y="65" width="80" height="18" rx="9" fill="#0284c7" opacity="0.3"/>
      <text x="80" y="77" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">WEB DESIGN</text>
      <text x="40" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff">Creative Web</text>
      <text x="40" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#f59e0b">Architectures</text>
      <text x="40" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">Modern responsive frontend with HTML5, CSS3, &amp; Bootstrap.</text>

      <!-- Buttons -->
      <rect x="40" y="172" width="90" height="26" rx="13" fill="#0284c7"/>
      <text x="85" y="188" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Live Demo</text>
      <rect x="140" y="172" width="80" height="26" rx="13" fill="none" stroke="#64748b"/>
      <text x="180" y="188" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">GitHub</text>

      <!-- Cards Grid inside mockup -->
      <rect x="20" y="235" width="175" height="75" rx="8" fill="#1e293b"/>
      <circle cx="40" cy="260" r="10" fill="#38bdf8"/>
      <rect x="60" y="255" width="80" height="8" rx="4" fill="#ffffff"/>
      <rect x="40" y="280" width="130" height="6" rx="3" fill="#64748b"/>

      <rect x="210" y="235" width="175" height="75" rx="8" fill="#1e293b"/>
      <circle cx="230" cy="260" r="10" fill="#f59e0b"/>
      <rect x="250" y="255" width="80" height="8" rx="4" fill="#ffffff"/>
      <rect x="230" y="280" width="130" height="6" rx="3" fill="#64748b"/>

      <rect x="400" y="235" width="175" height="75" rx="8" fill="#1e293b"/>
      <circle cx="420" cy="260" r="10" fill="#10b981"/>
      <rect x="440" y="255" width="80" height="8" rx="4" fill="#ffffff"/>
      <rect x="420" y="280" width="130" height="6" rx="3" fill="#64748b"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(50, 430)">
    <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <text x="90" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">WEB DESIGN</text>
  </g>
</svg>
