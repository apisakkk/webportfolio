<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#vbg)"/>

  <!-- Film Strip Top & Bottom Decor -->
  <g fill="#1e293b" opacity="0.4">
    <rect x="0" y="20" width="800" height="25"/>
    <rect x="0" y="455" width="800" height="25"/>
    <!-- Sprocket holes -->
    <rect x="20" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="70" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="120" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="170" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="220" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="270" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="320" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="370" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="420" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="470" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="520" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="570" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="620" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="670" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="720" y="25" width="20" height="15" rx="3" fill="#050b14"/>
    <rect x="760" y="25" width="20" height="15" rx="3" fill="#050b14"/>
  </g>

  <!-- Video Editor UI Window Mockup -->
  <g transform="translate(100, 75)">
    <!-- Main Monitor Frame -->
    <rect width="600" height="340" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Header bar -->
    <rect width="600" height="32" rx="14" fill="#1e293b"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="16" r="5" fill="#10b981"/>
    <text x="300" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">URBAN_ECHOES_4K_MASTER.prproj</text>
    <rect x="520" y="8" width="60" height="16" rx="4" fill="#0284c7"/>
    <text x="550" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RENDER</text>

    <!-- Video Preview Area -->
    <rect x="20" y="45" width="560" height="180" rx="8" fill="#020617"/>
    
    <!-- Cinematic Skyline in Preview -->
    <path d="M40 180 L80 120 L120 180 L180 90 L240 160 L320 70 L400 170 L480 110 L540 180 Z" fill="#0369a1" opacity="0.3"/>
    <circle cx="280" cy="100" r="35" fill="#f59e0b" opacity="0.8"/>
    <!-- Rule of thirds grid -->
    <line x1="206" y1="45" x2="206" y2="225" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
    <line x1="393" y1="45" x2="393" y2="225" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="105" x2="580" y2="105" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="165" x2="580" y2="165" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>

    <!-- Large Play Button Center -->
    <circle cx="300" cy="135" r="30" fill="url(#vGrad)" opacity="0.95"/>
    <polygon points="293,122 314,135 293,148" fill="#ffffff"/>

    <!-- Timecode HUD -->
    <text x="40" y="70" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">REC ● 00:04:18:22</text>
    <text x="560" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="end">4K 60FPS DCI</text>

    <!-- Audio / Video Timeline -->
    <g transform="translate(20, 240)">
      <rect width="560" height="85" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Video Track 1 -->
      <rect x="10" y="10" width="160" height="20" rx="4" fill="#0284c7" opacity="0.85"/>
      <rect x="175" y="10" width="220" height="20" rx="4" fill="#0369a1" opacity="0.95"/>
      <rect x="400" y="10" width="150" height="20" rx="4" fill="#0284c7" opacity="0.85"/>
      
      <!-- Audio Track with Waveforms -->
      <rect x="10" y="35" width="260" height="18" rx="4" fill="#f59e0b" opacity="0.85"/>
      <rect x="275" y="35" width="275" height="18" rx="4" fill="#d97706" opacity="0.95"/>

      <!-- FX Track -->
      <rect x="60" y="58" width="180" height="16" rx="3" fill="#a855f7" opacity="0.8"/>
      <rect x="310" y="58" width="200" height="16" rx="3" fill="#ec4899" opacity="0.8"/>

      <!-- Timeline Playhead Scrubber -->
      <line x1="280" y1="5" x2="280" y2="80" stroke="#ffffff" stroke-width="2"/>
      <polygon points="275,5 285,5 280,12" fill="#ffffff"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(50, 430)">
    <rect width="180" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <text x="90" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">VIDEO EDITING</text>
  </g>
</svg>
