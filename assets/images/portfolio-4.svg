<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="uxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="50%" stop-color="#0f213d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#uxBg)"/>

  <!-- Subtle UI Mockup Circles -->
  <circle cx="200" cy="150" r="140" fill="#0284c7" opacity="0.2" filter="blur(40px)"/>
  <circle cx="620" cy="350" r="150" fill="#f59e0b" opacity="0.18" filter="blur(40px)"/>

  <!-- Left Phone Screen (Background Layer) -->
  <g transform="translate(180, 70) rotate(-10)" filter="url(#phoneShadow)">
    <rect width="210" height="420" rx="34" fill="#020617" stroke="#334155" stroke-width="4"/>
    <rect x="15" y="15" width="180" height="390" rx="24" fill="#0f172a"/>
    <!-- Status bar -->
    <text x="35" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">9:41</text>
    <circle cx="160" cy="32" r="4" fill="#ffffff"/>
    <!-- Wireframe cards -->
    <rect x="30" y="60" width="150" height="80" rx="14" fill="#0284c7" opacity="0.6"/>
    <rect x="30" y="155" width="70" height="60" rx="10" fill="#1e293b"/>
    <rect x="110" y="155" width="70" height="60" rx="10" fill="#1e293b"/>
    <rect x="30" y="230" width="150" height="45" rx="10" fill="#1e293b"/>
    <rect x="30" y="290" width="150" height="45" rx="10" fill="#1e293b"/>
  </g>

  <!-- Right Phone Screen (Foreground Focused) -->
  <g transform="translate(410, 50) rotate(5)" filter="url(#phoneShadow)">
    <!-- Phone Bezel -->
    <rect width="220" height="440" rx="36" fill="#0b0f19" stroke="#38bdf8" stroke-width="3"/>
    <rect x="12" y="12" width="196" height="416" rx="28" fill="#ffffff"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="75" y="20" width="70" height="18" rx="9" fill="#0b0f19"/>

    <!-- Screen Content -->
    <!-- App Header -->
    <g transform="translate(25, 55)">
      <circle cx="14" cy="14" r="14" fill="#f1f5f9"/>
      <text x="14" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">✦</text>
      <text x="38" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Good Morning</text>
      <text x="38" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Creative Mind</text>
      <circle cx="155" cy="14" r="14" fill="#fef3c7"/>
      <circle cx="155" cy="14" r="6" fill="#f59e0b"/>
    </g>

    <!-- Hero Card inside Phone -->
    <g transform="translate(25, 105)">
      <rect width="170" height="110" rx="18" fill="#0284c7"/>
      <circle cx="140" cy="30" r="30" fill="#38bdf8" opacity="0.4"/>
      <text x="16" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Discover Art</text>
      <text x="16" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff">Creative Hub</text>
      <rect x="16" y="70" width="80" height="24" rx="12" fill="#f59e0b"/>
      <text x="56" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Explore</text>
    </g>

    <!-- Category Pills -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="50" height="24" rx="12" fill="#0284c7"/>
      <text x="25" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">All</text>

      <rect x="58" y="0" width="52" height="24" rx="12" fill="#f1f5f9"/>
      <text x="84" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">Design</text>

      <rect x="118" y="0" width="52" height="24" rx="12" fill="#f1f5f9"/>
      <text x="144" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">Motion</text>
    </g>

    <!-- Item List -->
    <g transform="translate(25, 270)">
      <rect width="170" height="55" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="35" height="35" rx="10" fill="#e0f2fe"/>
      <circle cx="27" cy="27" r="8" fill="#0284c7"/>
      <text x="55" y="27" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Visual System</text>
      <text x="55" y="40" font-family="sans-serif" font-size="10" fill="#94a3b8">UI Architecture</text>
      <circle cx="150" cy="27" r="10" fill="#fef3c7"/>
      <text x="150" y="31" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">★</text>
    </g>

    <g transform="translate(25, 335)">
      <rect width="170" height="55" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="35" height="35" rx="10" fill="#fef3c7"/>
      <circle cx="27" cy="27" r="8" fill="#f59e0b"/>
      <text x="55" y="27" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Design Tokens</text>
      <text x="55" y="40" font-family="sans-serif" font-size="10" fill="#94a3b8">Color &amp; Layout</text>
    </g>

    <!-- Bottom Nav Bar -->
    <g transform="translate(20, 398)">
      <rect width="180" height="20" rx="10" fill="#f8fafc"/>
      <circle cx="35" cy="10" r="5" fill="#0284c7"/>
      <circle cx="75" cy="10" r="4" fill="#94a3b8"/>
      <circle cx="115" cy="10" r="4" fill="#94a3b8"/>
      <circle cx="150" cy="10" r="4" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(50, 430)">
    <rect width="170" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <text x="85" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">UI/UX DESIGN</text>
  </g>
</svg>
