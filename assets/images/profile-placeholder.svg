<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba86c" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="120" r="90" fill="#0284c7" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="410" cy="380" r="110" fill="#f59e0b" opacity="0.25" filter="url(#softGlow)" />

  <!-- Creative Geometric Patterns & Ring -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Creative Media Floating Elements / Icons -->
  <g transform="translate(60, 200)" opacity="0.85">
    <rect width="45" height="45" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="17,14 34,22.5 17,31" fill="#f59e0b"/>
  </g>
  <g transform="translate(385, 130)" opacity="0.85">
    <rect width="45" height="45" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="22.5" cy="22.5" r="9" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="22.5" cy="22.5" r="3" fill="#f59e0b"/>
  </g>
  <g transform="translate(370, 310)" opacity="0.85">
    <rect width="50" height="32" rx="8" fill="#0284c7" opacity="0.9"/>
    <text x="25" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UX/UI</text>
  </g>

  <!-- Avatar Group -->
  <g id="character">
    <!-- Body / Shoulders -->
    <path d="M140 460 C140 370, 190 350, 250 350 C310 350, 360 370, 360 460 Z" fill="url(#clothGrad)" />
    <!-- Collar & Jacket Accent -->
    <path d="M225 352 L250 410 L275 352 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M250 410 L250 460" stroke="#f59e0b" stroke-width="3"/>
    <path d="M190 375 L225 460" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <path d="M310 375 L275 460" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

    <!-- Neck -->
    <rect x="228" y="290" width="44" height="65" rx="10" fill="url(#skinGrad)" />

    <!-- Head -->
    <ellipse cx="250" cy="235" rx="65" ry="75" fill="url(#skinGrad)" />

    <!-- Hair (Creative & Modern Cut) -->
    <path d="M185 220 C180 150, 240 135, 275 140 C320 145, 325 180, 320 215 C310 205, 300 205, 290 195 C280 185, 240 185, 220 200 C205 210, 195 210, 185 220 Z" fill="url(#hairGrad)" />
    <path d="M180 220 C175 240, 185 260, 188 270 C185 250, 195 240, 190 220 Z" fill="url(#hairGrad)" />

    <!-- Creative Media Glasses (Modern Smart Frame) -->
    <rect x="205" y="220" width="38" height="26" rx="8" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <rect x="257" y="220" width="38" height="26" rx="8" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <line x1="243" y1="230" x2="257" y2="230" stroke="#f59e0b" stroke-width="3.5" />
    <!-- Glass Lens Reflections -->
    <line x1="210" y1="240" x2="230" y2="225" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <line x1="262" y1="240" x2="282" y2="225" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

    <!-- Smile -->
    <path d="M236 272 Q250 285 264 272" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />

    <!-- Creative Headset / Headphones -->
    <path d="M175 225 C170 190, 200 155, 250 155 C300 155, 330 190, 325 225" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="168" y="215" width="16" height="35" rx="8" fill="#f59e0b" />
    <rect x="316" y="215" width="16" height="35" rx="8" fill="#f59e0b" />
  </g>

  <!-- Tag / Status Badge at bottom -->
  <g transform="translate(145, 435)">
    <rect width="210" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="25" cy="19" r="6" fill="#10b981"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Creative Media Artist</text>
  </g>
</svg>
